name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Regenerate platform folders
        run: |
          flutter create --org com.rfahim8130 --project-name photo_forge --platforms=android .

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          fi

      - name: Upgrade Kotlin version
        run: |
          # settings.gradle এ Kotlin ভার্সন আপডেট
          SETTINGS="android/settings.gradle"
          if [ -f "$SETTINGS" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' "$SETTINGS"
          fi
          # settings.gradle.kts থাকলে সেটাতেও
          SETTINGS_KTS="android/settings.gradle.kts"
          if [ -f "$SETTINGS_KTS" ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.0.21"/g' "$SETTINGS_KTS"
          fi
          # build.gradle এ kotlin_version আপডেট
          BUILD="android/build.gradle"
          if [ -f "$BUILD" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.21"/g' "$BUILD"
          fi
          echo "Kotlin version updated"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          tag_name: ${{ github.ref_name }}
          name: PhotoForge ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-forge-apk
          path: build/app/outputs/flutter-apk/*.apk
