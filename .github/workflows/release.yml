name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Regenerate platform folders
        run: |
          flutter create --org com.rfahim8130 --project-name photo_forge --platforms=android .

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          fi

      - name: Fix Gradle & Kotlin versions
        run: |
          # ---------- settings.gradle ----------
          SETTINGS="android/settings.gradle"
          if [ -f "$SETTINGS" ]; then
            # Kotlin plugin version -> 1.9.24 (stable, compatible with most)
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' "$SETTINGS"
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.1.4"/g' "$SETTINGS"
          fi

          SETTINGS_KTS="android/settings.gradle.kts"
          if [ -f "$SETTINGS_KTS" ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.24"/g' "$SETTINGS_KTS"
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.1.4"/g' "$SETTINGS_KTS"
          fi

          # ---------- android/build.gradle ----------
          BUILD="android/build.gradle"
          if [ -f "$BUILD" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' "$BUILD"
          fi

          # ---------- gradle-wrapper.properties ----------
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip|g' "$WRAPPER"
          fi

          # ---------- app/build.gradle : compileSdk & minSdk ----------
          APP_BUILD="android/app/build.gradle"
          if [ -f "$APP_BUILD" ]; then
            sed -i 's/compileSdk .*/compileSdk 34/g' "$APP_BUILD"
            sed -i 's/minSdk .*/minSdk 21/g' "$APP_BUILD"
            sed -i 's/targetSdk .*/targetSdk 34/g' "$APP_BUILD"
            # Kotlin jvmTarget
            if ! grep -q "jvmTarget" "$APP_BUILD"; then
              sed -i '/compileOptions {/a\        kotlinOptions { jvmTarget = "17" }' "$APP_BUILD" || true
            fi
          fi

          echo "Gradle & Kotlin versions fixed"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          tag_name: ${{ github.ref_name }}
          name: PhotoForge ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-forge-apk
          path: build/app/outputs/flutter-apk/*.apk
